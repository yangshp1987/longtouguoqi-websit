<svg viewBox="0 0 680 350" width="100%" xmlns="http://www.w3.org/2000/svg">
<title>正大明百年：过去·现在·未来</title>
<desc>1925至2025年正大明品牌发展三段式时间轴：商号岁月、归国再造、东方新篇。</desc>
<rect x="40" y="52" width="186" height="278" rx="12" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="133" y="76" text-anchor="middle" dominant-baseline="central" font-family="Songti SC, STSong, SimSun, serif" font-size="15" font-weight="500" fill="#791F1F">过去</text>
<text x="133" y="96" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="12" fill="#A32D2D">1925–2013 · 商号岁月</text>
<line x1="54" y1="108" x2="212" y2="108" stroke="#A32D2D" stroke-opacity="0.3" stroke-width="0.5"/>
<text x="133" y="132" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="500" fill="#791F1F">1925</text>
<text x="133" y="153" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="12" fill="#5F5E5A">商号创立于秦巴漆乡</text>
<text x="133" y="164" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="500" fill="#791F1F">1931</text>
<text x="133" y="185" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="12" fill="#5F5E5A">经上海港转口日本</text>
<text x="133" y="196" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="500" fill="#791F1F">1934</text>
<text x="133" y="217" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="12" fill="#5F5E5A">精制彩色漆问世</text>
<text x="133" y="228" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="500" fill="#791F1F">1938–42</text>
<text x="133" y="249" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="12" fill="#5F5E5A">战火中以山为库</text>
<text x="133" y="260" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="500" fill="#791F1F">1956</text>
<text x="133" y="281" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="12" fill="#5F5E5A">公私合营 技艺入民间</text>
<text x="133" y="292" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="500" fill="#791F1F">1985</text>
<text x="133" y="313" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="12" fill="#5F5E5A">出口恢复 暗涌待春</text>
<rect x="247" y="52" width="186" height="278" rx="12" fill="#F7C1C1" stroke="#791F1F" stroke-width="0.5"/>
<text x="340" y="76" text-anchor="middle" dominant-baseline="central" font-family="Songti SC, STSong, SimSun, serif" font-size="15" font-weight="500" fill="#501313">现在</text>
<text x="340" y="96" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="12" fill="#791F1F">2014–2025 · 赓续再造</text>
<line x1="261" y1="108" x2="419" y2="108" stroke="#791F1F" stroke-opacity="0.3" stroke-width="0.5"/>
<text x="340" y="132" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="500" fill="#501313">2014</text>
<text x="340" y="153" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="12" fill="#5F5E5A">归国接续百年漆脉</text>
<text x="340" y="164" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="500" fill="#501313">2017</text>
<text x="340" y="185" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="12" fill="#5F5E5A">建成约五千亩漆林</text>
<text x="340" y="196" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="500" fill="#501313">2020</text>
<text x="340" y="217" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="12" fill="#5F5E5A">参与制定行业标准</text>
<text x="340" y="228" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="500" fill="#501313">2021–23</text>
<text x="340" y="249" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="12" fill="#5F5E5A">省级非遗·非遗工坊</text>
<text x="340" y="260" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="500" fill="#501313">2022</text>
<text x="340" y="281" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="12" fill="#5F5E5A">品牌矩阵落子西安</text>
<text x="340" y="292" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="500" fill="#501313">2025</text>
<text x="340" y="313" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="12" fill="#5F5E5A">iF设计奖·百年答卷</text>
<rect x="454" y="52" width="186" height="278" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="547" y="76" text-anchor="middle" dominant-baseline="central" font-family="Songti SC, STSong, SimSun, serif" font-size="15" font-weight="500" fill="#633806">未来</text>
<text x="547" y="96" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="12" fill="#854F0B">2025– · 走向下一百年</text>
<line x1="468" y1="108" x2="626" y2="108" stroke="#854F0B" stroke-opacity="0.3" stroke-width="0.5"/>
<text x="547" y="136" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="500" fill="#633806">器物</text>
<text x="547" y="158" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="12" fill="#5F5E5A">大师手作 × 当代设计</text>
<text x="547" y="176" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="500" fill="#633806">产业</text>
<text x="547" y="198" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="12" fill="#5F5E5A">标准化 × 数智化</text>
<text x="547" y="216" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="500" fill="#633806">文化</text>
<text x="547" y="238" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="12" fill="#5F5E5A">非遗研学 · 薪火相传</text>
<text x="547" y="256" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="500" fill="#633806">品牌</text>
<text x="547" y="278" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="12" fill="#5F5E5A">东方大漆 · 走向世界</text>
<text x="547" y="296" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="500" fill="#633806">心法</text>
<text x="547" y="318" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="12" fill="#5F5E5A">正于心 · 明于器</text>
</svg>
